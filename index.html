<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Generador de Documentos CUN (Asistente)</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <style>
      /* --- Paleta de Colores --- */
      :root {
        --verde-principal: #047835;
        --verde-acento: #7fbc03;
        --gris-texto: #333;
        --gris-sutil: #6d6e71;
        --gris-fondo: #f8f9fa;
        --gris-borde: #e0e0e0;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
        margin: 0;
        padding: 2rem 0;
        background-color: var(--gris-fondo);
        color: var(--gris-texto);
        line-height: 1.6;
      }

      /* --- 1. Contenedor Principal --- */
      .wizard-container {
        max-width: 960px;
        margin: 2rem auto;
        background-color: #fff;
        border: 1px solid var(--gris-borde);
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.07);
        border-radius: 16px;
        overflow: hidden;
      }

      /* --- 2. Barra de Progreso (Stepper) --- */
      .progress-bar {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        padding: 2.5rem 4rem;
        border-bottom: 1px solid var(--gris-borde);
        background-color: #fff;
        position: relative;
      }
      .progress-bar::before {
        content: "";
        position: absolute;
        top: calc(2.5rem + 20px);
        left: 5rem;
        right: 5rem;
        height: 2px;
        background-color: var(--gris-borde);
        transform: translateY(-50%);
        z-index: 1;
      }
      .progress-step {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.65rem;
        font-size: 0.85rem;
        font-weight: 500;
        color: var(--gris-sutil);
        cursor: pointer;
        transition: all 0.2s;
        position: relative;
        z-index: 2;
        width: 100px;
        text-align: center;
        background-color: #fff;
      }
      .progress-step span {
        line-height: 1.3;
      }
      .step-icon {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: #fff;
        border: 2px solid var(--gris-borde);
        transition: all 0.2s;
        font-size: 1.1rem;
        font-weight: 600;
      }
      .progress-step svg {
        width: 20px;
        height: 20px;
        stroke-width: 2.5;
        color: var(--gris-sutil);
        transition: color 0.2s;
      }
      .progress-step:not(.active):hover .step-icon {
        border-color: var(--verde-principal);
      }
      .progress-step:not(.active):hover span {
        color: var(--verde-principal);
      }
      .progress-step:not(.active):hover svg {
        color: var(--verde-principal);
      }
      .progress-step.active .step-icon {
        background-color: var(--verde-principal);
        border-color: var(--verde-principal);
        color: white;
      }
      .progress-step.active svg {
        color: white;
      }
      .progress-step.active span {
        color: var(--verde-principal);
        font-weight: 700;
      }
      .progress-step.completed .step-icon {
        background-color: #fff;
        border-color: var(--verde-principal);
        color: var(--verde-principal);
      }
      .progress-step.completed svg {
        color: var(--verde-principal);
      }
      .progress-step.completed span {
        color: var(--gris-texto);
      }

      /* --- 3. Contenido de los Pasos --- */
      .wizard-content {
        padding: 3rem 4rem;
      }
      .step-content {
        display: none;
      }
      .step-content.active {
        display: block;
        animation: fadeIn 0.5s ease;
      }
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      /* --- 4. Campos de Formulario --- */
      h3 {
        font-size: 1.85rem;
        font-weight: 700;
        color: var(--verde-acento);
        margin-top: 0;
        margin-bottom: 2.5rem;
        border-left: 5px solid var(--verde-acento);
        padding-left: 1rem;
      }
      .form-group {
        margin-bottom: 2rem;
      }
      .form-group label {
        display: block;
        font-weight: 600;
        margin-bottom: 0.6rem;
        color: #444;
      }
      .form-group input[type="text"],
      .form-group textarea {
        width: 100%;
        padding: 0.85rem 1rem;
        font-size: 1rem;
        border: 1px solid var(--gris-borde);
        border-radius: 10px;
        box-sizing: border-box;
        font-family: inherit;
        transition: border-color 0.2s, box-shadow 0.2s;
      }
      .form-group input[type="text"]:focus,
      .form-group textarea:focus {
        border-color: var(--verde-principal);
        box-shadow: 0 0 0 4px rgba(4, 120, 53, 0.1);
        outline: none;
      }
      .form-group input:required:invalid,
      .form-group textarea:required:invalid {
        border-color: var(--verde-acento);
      }
      .form-group textarea {
        min-height: 160px;
        resize: vertical;
      }

      /* --- Estilo de Carga de Archivos --- */
      .file-input-hidden {
        display: none;
      }
      .file-upload-group label {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.75rem;
        padding: 1.5rem;
        border: 2px dashed var(--gris-borde);
        border-radius: 12px;
        cursor: pointer;
        transition: all 0.2s ease;
        text-align: center;
      }
      .file-upload-group label:hover {
        border-color: var(--verde-principal);
        background-color: #fdfdfd;
      }
      .file-upload-group svg {
        width: 28px;
        height: 28px;
        color: var(--verde-principal);
      }
      .file-upload-group span {
        font-weight: 500;
        color: var(--gris-texto);
      }
      .file-name {
        font-size: 0.9rem;
        color: var(--gris-sutil);
        font-style: italic;
        margin-top: 0.5rem;
      }

      /* --- 5. Estilos para items dinámicos --- */
      .dynamic-list {
        border: none;
        padding: 0;
        display: grid;
        gap: 1.5rem;
      }
      .dynamic-item {
        padding: 1.5rem;
        padding-right: 4rem;
        border: 1px solid var(--gris-borde);
        background-color: #fdfdfd;
        border-radius: 12px;
        position: relative;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.03);
      }
      .remove-button {
        position: absolute;
        top: 1.5rem;
        right: 1.5rem;
        background: #f0f0f0;
        border: none;
        color: var(--gris-sutil);
        font-size: 1rem;
        font-weight: bold;
        line-height: 1;
        cursor: pointer;
        transition: all 0.2s;
        width: 30px;
        height: 30px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .remove-button:hover {
        color: white;
        background-color: var(--verde-acento);
        transform: scale(1.1);
      }
      .dynamic-item input[type="text"],
      .dynamic-item textarea {
        width: 100%;
        padding: 0.75rem;
        font-size: 1rem;
        border: 1px solid #ccc;
        border-radius: 8px;
        box-sizing: border-box;
        font-family: inherit;
      }
      .dynamic-item input[type="text"] {
        margin-bottom: 0.5rem;
      }
      .dynamic-item textarea {
        padding-right: 1rem;
      }
      .add-button {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        background-color: var(--verde-principal);
        color: white;
        border: none;
        padding: 0.7rem 1.25rem;
        font-size: 0.95rem;
        font-weight: 600;
        border-radius: 10px;
        cursor: pointer;
        transition: all 0.2s ease;
        margin-top: 1.5rem;
      }
      .add-button:hover {
        background-color: #024b21;
        transform: translateY(-2px);
        box-shadow: 0 6px 12px rgba(4, 120, 53, 0.2);
      }
      .add-button svg {
        width: 18px;
        height: 18px;
      }

      /* --- 6. Navegación --- */
      .wizard-navigation {
        display: flex;
        justify-content: space-between;
        padding: 1.5rem 4rem;
        border-top: 1px solid var(--gris-borde);
        background-color: #fff;
      }
      .wizard-button {
        background-color: var(--gris-sutil);
        color: white;
        border: none;
        padding: 0.85rem 1.75rem;
        font-size: 1rem;
        font-weight: 600;
        border-radius: 10px;
        cursor: pointer;
        transition: all 0.2s ease;
      }
      .wizard-button:not(:disabled):hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 12px rgba(0, 0, 0, 0.1);
      }
      .wizard-button#next-btn,
      .wizard-button#finish-btn {
        background-color: var(--verde-acento);
      }
      .wizard-button#next-btn:hover,
      .wizard-button#finish-btn:hover {
        background-color: #6c9f02;
        box-shadow: 0 6px 12px rgba(127, 188, 3, 0.3);
      }
      .wizard-button:disabled {
        background-color: #ccc;
        cursor: not-allowed;
      }
    </style>
  </head>
  <body>
    <svg width="0" height="0" style="display: none">
      <symbol
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"

      >

        <path

        stroke-linecap="round"

        <line x1="16" y1="13" x2="8" y2="13"></line>
        <line x1="16" y1="17" x2="8" y2="17"></line>
        <polyline points="10 9 9 9 8 9"></polyline>
      </symbol>
      <symbol

      <symbol

        <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>

      </symbol>
      <symbol

        stroke-width="2"
        stroke-linecap="round"

        id="icon-book"
      >
        <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
        <path
          d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"
        ></path>
      </symbol>
      <symbol
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 24 24"

        stroke="currentColor"

        stroke-linecap="round"

      >
        <line x1="12" y1="5" x2="12" y2="19"></line>
        <line x1="5" y1="12" x2="19" y2="12"></line>
      </symbol>
      <symbol
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        id="icon-upload"
      >
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
        <polyline points="17 8 12 3 7 8"></polyline>
        <line x1="12" y1="3" x2="12" y2="15"></line>
      </symbol>
    </svg>

    <div class="wizard-container">
      <div class="progress-bar">
        <div class="progress-step active" data-step="1">
          <div class="step-icon">
            <svg><use href="#icon-edit" /></svg>
          </div>
          <span>Portada</span>
        </div>
        <div class="progress-step" data-step="2">
          <div class="step-icon">
            <svg><use href="#icon-file-text" /></svg>
          </div>
          <span>Introducción</span>
        </div>
        <div class="progress-step" data-step="3">
          <div class="step-icon">
            <svg><use href="#icon-list" /></svg>
          </div>
          <span>Conceptos</span>
        </div>
        <div class="progress-step" data-step="4">
          <div class="step-icon">1</div>
          <span>Ensayo 1</span>
        </div>
        <div class="progress-step" data-step="5">
          <div class="step-icon">2</div>
          <span>Ensayo 2</span>
        </div>
        <div class="progress-step" data-step="6">
          <div class="step-icon">3</div>
          <span>Ensayo 3</span>
        </div>
        <div class="progress-step" data-step="7">
          <div class="step-icon">
            <svg><use href="#icon-check" /></svg>
          </div>
          <span>Conclusiones</span>
        </div>
        <div class="progress-step" data-step="8">
          <div class="step-icon">
            <svg><use href="#icon-book" /></svg>
          </div>
          <span>Bibliografía</span>
        </div>
      </div>

      <form id="wizard-form" onsubmit="return false;">
        <div class="wizard-content">
          <div id="step-1" class="step-content active">
            <h3>Paso 1: Portada</h3>
            <div class="form-group">
              <label for="titulo">Título de la Portada</label
              ><input
                type="text"
                id="titulo"
                placeholder="Ej: Conceptos básicos de la administración"
                required
              />
            </div>
            <div class="form-group">
              <label for="subtitulo">Subtítulo (Materia)</label
              ><input
                type="text"
                id="subtitulo"
                placeholder="Ej: Fundamentos de Administración Transversal"
                required
              />
            </div>
            <div class="form-group file-upload-group">
              <label for="img-portada"
                ><svg><use href="#icon-upload" /></svg
                ><span>Subir Imagen de Portada (Opcional, 16:9)</span
                ><span id="file-name-portada" class="file-name"></span></label
              ><input
                type="file"
                id="img-portada"
                accept="image/*"
                class="file-input-hidden"
              />
            </div>
          </div>
          <div id="step-2" class="step-content">
            <h3>Paso 2: Introducción</h3>
            <div class="form-group">
              <label for="texto-intro">Texto de la Introducción</label
              ><textarea
                id="texto-intro"
                rows="10"
                placeholder="Escribe aquí la introducción..."
                required
              ></textarea>
            </div>
          </div>
          <div id="step-3" class="step-content">
            <h3>Paso 3: Conceptos Clave</h3>
            <div id="conceptos-list" class="dynamic-list"></div>
            <button id="add-concepto" class="add-button" type="button">
              <svg><use href="#icon-plus" /></svg><span>Añadir Concepto</span>
            </button>
          </div>
          <div id="step-4" class="step-content">
            <h3>Paso 4: Ensayo 1</h3>
            <div class="form-group">
              <label for="titulo-ensayo1">Título del Ensayo 1</label
              ><input
                type="text"
                id="titulo-ensayo1"
                placeholder="Ej: Fundamentos de la administración"
              />
            </div>
            <div class="form-group">
              <label for="texto-ensayo1">Texto del Ensayo 1</label
              ><textarea id="texto-ensayo1" rows="8"></textarea>
            </div>
            <div class="form-group file-upload-group">
              <label for="img-ensayo1"
                ><svg><use href="#icon-upload" /></svg
                ><span>Subir Imagen (Opcional)</span
                ><span id="file-name-ensayo1" class="file-name"></span></label
              ><input
                type="file"
                id="img-ensayo1"
                accept="image/*"
                class="file-input-hidden"
              />
            </div>
          </div>
          <div id="step-5" class="step-content">
            <h3>Paso 5: Ensayo 2</h3>
            <div class="form-group">
              <label for="titulo-ensayo2">Título del Ensayo 2</label
              ><input
                type="text"
                id="titulo-ensayo2"
                placeholder="Ej: La organización como sistema"
              />
            </div>
            <div class="form-group">
              <label for="texto-ensayo2">Texto del Ensayo 2</label
              ><textarea id="texto-ensayo2" rows="8"></textarea>
            </div>
            <div class="form-group file-upload-group">
              <label for="img-ensayo2"
                ><svg><use href="#icon-upload" /></svg
                ><span>Subir Imagen (Opcional)</span
                ><span id="file-name-ensayo2" class="file-name"></span></label
              ><input
                type="file"
                id="img-ensayo2"
                accept="image/*"
                class="file-input-hidden"
              />
            </div>
          </div>
          <div id="step-6" class="step-content">
            <h3>Paso 6: Ensayo 3</h3>
            <div class="form-group">
              <label for="titulo-ensayo3">Título del Ensayo 3</label
              ><input
                type="text"
                id="titulo-ensayo3"
                placeholder="Ej: Recurso humano y liderazgo"
              />
            </div>
            <div class="form-group">
              <label for="texto-ensayo3">Texto del Ensayo 3</label
              ><textarea id="texto-ensayo3" rows="8"></textarea>
            </div>
            <div class="form-group file-upload-group">
              <label for="img-ensayo3"
                ><svg><use href="#icon-upload" /></svg
                ><span>Subir Imagen (Opcional)</span
                ><span id="file-name-ensayo3" class="file-name"></span></label
              ><input
                type="file"
                id="img-ensayo3"
                accept="image/*"
                class="file-input-hidden"
              />
            </div>
          </div>
          <div id="step-7" class="step-content">
            <h3>Paso 7: Conclusiones</h3>
            <div class="form-group">
              <label for="texto-conclusiones">Texto de las Conclusiones</label
              ><textarea id="texto-conclusiones" rows="10" required></textarea>
            </div>
          </div>
          <div id="step-8" class="step-content">
            <h3>Paso 8: Bibliografía</h3>
            <div id="biblio-list" class="dynamic-list"></div>
            <button id="add-biblio" class="add-button" type="button">
              <svg><use href="#icon-plus" /></svg><span>Añadir Referencia</span>
            </button>
          </div>
        </div>

        <div class="wizard-navigation">
          <button id="prev-btn" class="wizard-button" type="button">
            Anterior
          </button>
          <button id="next-btn" class="wizard-button" type="button">
            Siguiente
          </button>
          <button
            id="finish-btn"
            class="wizard-button"
            style="display: none"
            type="button"
          >
            Generar PDF
          </button>
        </div>
      </form>
    </div>

    <script>
      // --- 1. CONFIGURACIÓN INICIAL ---
      let currentStep = 1;
      const totalSteps = 8;
      const imageStore = {
        portada: null,
        ensayo1: null,
        ensayo2: null,
        ensayo3: null,
      };

      // --- 2. NAVEGACIÓN DEL ASISTENTE ---
      const wizardForm = document.getElementById("wizard-form");
      const prevBtn = document.getElementById("prev-btn");
      const nextBtn = document.getElementById("next-btn");
      const finishBtn = document.getElementById("finish-btn");
      const progressSteps = document.querySelectorAll(".progress-step");
      const stepContents = document.querySelectorAll(".step-content");

      function showStep(stepNumber) {
        currentStep = stepNumber;
        progressSteps.forEach((step, index) => {
          const stepNum = index + 1;
          step.classList.remove("active", "completed");
          if (stepNum === currentStep) step.classList.add("active");
          else if (stepNum < currentStep) step.classList.add("completed");
        });
        stepContents.forEach((content, index) => {
          content.classList.toggle("active", index + 1 === currentStep);
        });
        prevBtn.disabled = currentStep === 1;
        prevBtn.style.display = currentStep === 1 ? "none" : "block";
        nextBtn.style.display = currentStep === totalSteps ? "none" : "block";
        finishBtn.style.display = currentStep === totalSteps ? "block" : "none";
      }

      function validateStep(stepNumber) {
        const currentStepFields = document.querySelectorAll(
          `#step-${stepNumber} [required]`
        );
        for (const field of currentStepFields) {
          if (!field.checkValidity()) {
            field.reportValidity();
            return false;
          }
        }
        return true;
      }

      nextBtn.addEventListener("click", () => {
        if (validateStep(currentStep) && currentStep < totalSteps)
          showStep(currentStep + 1);
      });
      prevBtn.addEventListener("click", () => {
        if (currentStep > 1) showStep(currentStep - 1);
      });
      progressSteps.forEach((step) => {
        step.addEventListener("click", () => {
          const stepToGo = parseInt(step.dataset.step, 10);
          if (
            stepToGo < currentStep ||
            (stepToGo === currentStep + 1 && validateStep(currentStep))
          ) {
            showStep(stepToGo);
          }
        });
      });
      showStep(currentStep); // Initialize

      // --- 3. FUNCIONALIDAD DE LISTAS DINÁMICAS ---
      const conceptosList = document.getElementById("conceptos-list");
      document.getElementById("add-concepto").addEventListener("click", () => {
        const item = document.createElement("div");
        item.className = "dynamic-item";
        item.innerHTML = `<button type="button" class="remove-button" title="Eliminar concepto">&times;</button><input type="text" class="concepto-titulo" placeholder="Título del Concepto (Ej: Administración)" required><textarea class="concepto-desc" placeholder="Descripción del concepto..." required></textarea>`;
        conceptosList.appendChild(item);
      });
      const biblioList = document.getElementById("biblio-list");
      document.getElementById("add-biblio").addEventListener("click", () => {
        const item = document.createElement("div");
        item.className = "dynamic-item";
        item.innerHTML = `<button type="button" class="remove-button" title="Eliminar referencia">&times;</button><textarea class="biblio-ref" rows="2" placeholder="Apellido, A. (Año). Título. Editorial." required></textarea>`;
        biblioList.appendChild(item);
      });
      function setupRemoveListeners(listElement) {
        listElement.addEventListener("click", (e) => {
          if (e.target?.classList.contains("remove-button"))
            e.target.closest(".dynamic-item")?.remove();
        });
      }
      setupRemoveListeners(conceptosList);
      setupRemoveListeners(biblioList);
      document.getElementById("add-concepto").click();
      document.getElementById("add-biblio").click();

      // --- 4. MANEJO DE IMÁGENES ---
      function handleImageUpload(event, storeKey) {
        const file = event.target.files[0];
        imageStore[storeKey] = null;
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (e) => {
          imageStore[storeKey] = e.target.result;
        };
        reader.readAsDataURL(file);
      }
      function setupFileInput(inputId, spanId) {
        const input = document.getElementById(inputId);
        const span = document.getElementById(spanId);
        input.addEventListener("change", (e) => {
          span.textContent =
            e.target.files.length > 0 ? e.target.files[0].name : "";
        });
      }
      setupFileInput("img-portada", "file-name-portada");
      setupFileInput("img-ensayo1", "file-name-ensayo1");
      setupFileInput("img-ensayo2", "file-name-ensayo2");
      setupFileInput("img-ensayo3", "file-name-ensayo3");
      document
        .getElementById("img-portada")
        .addEventListener("change", (e) => handleImageUpload(e, "portada"));
      document
        .getElementById("img-ensayo1")
        .addEventListener("change", (e) => handleImageUpload(e, "ensayo1"));
      document
        .getElementById("img-ensayo2")
        .addEventListener("change", (e) => handleImageUpload(e, "ensayo2"));
      document
        .getElementById("img-ensayo3")
        .addEventListener("change", (e) => handleImageUpload(e, "ensayo3"));

      // --- 5. LÓGICA DE GENERACIÓN DE PDF NATIVO ---
      finishBtn.addEventListener("click", async () => {
        if (!validateStep(totalSteps)) {
          alert("Por favor, completa los campos requeridos en el último paso.");
          return;
        }
        const allRequiredFields = wizardForm.querySelectorAll("[required]");
        for (const field of allRequiredFields) {
          if (!field.checkValidity()) {
            const stepId = field.closest(".step-content").id;
            const stepNumber = parseInt(stepId.split("-")[1], 10);
            showStep(stepNumber);
            field.reportValidity();
            alert(
              `Faltan campos requeridos en el Paso ${stepNumber}. Por favor, revísalos.`
            );
            return;
          }
        }
        generatePDF();
      });

      async function generatePDF() {
        if (!window.jspdf) {
          alert(
            "Error: La librería PDF (jspdf) no se ha cargado. Revisa tu conexión a internet."
          );
          return;
        }
        const { jsPDF } = window.jspdf;
        finishBtn.disabled = true;
        finishBtn.textContent = "Generando...";

        try {
          const pdf = new jsPDF("p", "mm", "a4");
          const PDF_AZUL = "#047835";
          const PDF_ROJO = "#7FBC03";
          const PDF_GRIS = "#6D6E71";
          const TEXTO_NORMAL = "#333";
          const MARGIN_LEFT = 20;
          const MARGIN_RIGHT = 20;
          const MARGIN_TOP = 25;
          const MARGIN_BOTTOM = 25;
          const PAGE_WIDTH = pdf.internal.pageSize.getWidth();
          const PAGE_HEIGHT = pdf.internal.pageSize.getHeight();
          const CONTENT_WIDTH = PAGE_WIDTH - MARGIN_LEFT - MARGIN_RIGHT;
          let currentY = MARGIN_TOP;

          const addSectionTitle = (title) => {
            pdf.setFontSize(22);
            pdf.setFont("times", "bold");
            pdf.setTextColor(PDF_ROJO);
            let lines = pdf.splitTextToSize(title, CONTENT_WIDTH);
            let titleHeight = lines.length * 9;
            checkPageBreak(titleHeight + 15); // Aumentado espacio necesario
            currentY += 15; // --- CAMBIO: Espacio antes de la sección ---
            pdf.setDrawColor(PDF_ROJO);
            pdf.setLineWidth(1.5);
            pdf.line(
              MARGIN_LEFT - 2,
              currentY - 6,
              MARGIN_LEFT - 2,
              currentY + titleHeight - 9
            );
            pdf.text(lines, MARGIN_LEFT, currentY);
            currentY += titleHeight + 6;
          };

          const checkPageBreak = (spaceNeeded) => {
            if (currentY + spaceNeeded > PAGE_HEIGHT - MARGIN_BOTTOM) {
              pdf.addPage();
              currentY = MARGIN_TOP;
              pdf.setFont("times", "normal");
              pdf.setFontSize(12);
              pdf.setTextColor(TEXTO_NORMAL);
            }
          };

          const setupPage = () => {
            pdf.setFont("times", "normal");
            pdf.setFontSize(12);
            pdf.setTextColor(TEXTO_NORMAL);
          };

          // --- INICIO DE CONSTRUCCIÓN DEL PDF ---
          setupPage();

          // --- PASO 1: PORTADA ---
          const titulo = document.getElementById("titulo").value;
          const subtitulo = document.getElementById("subtitulo").value;
          const bannerHeight = 60; // Altura del banner
          const textBlockHeight =
            pdf.splitTextToSize(titulo, CONTENT_WIDTH).length * 10 +
            pdf.splitTextToSize(subtitulo, CONTENT_WIDTH).length * 7 +
            10;
          const imgHeight = imageStore.portada ? CONTENT_WIDTH * (7 / 16) : 0;
          const totalContentHeight =
            textBlockHeight + (imgHeight > 0 ? imgHeight + 10 : 0);

          // --- CAMBIO: Centrado Vertical Portada ---
          currentY = (PAGE_HEIGHT - totalContentHeight) / 2; // Calcula Y inicial para centrar
          if (currentY < MARGIN_TOP) currentY = MARGIN_TOP; // Asegura que no se salga por arriba

          // --- CAMBIO: Banner Superior ---
          pdf.setFillColor(PDF_AZUL);
          pdf.rect(0, currentY - 15, PAGE_WIDTH, bannerHeight + 15, "F"); // Dibuja banner (ajustado Y)

          pdf.setFontSize(30);
          pdf.setFont("times", "bold");
          pdf.setTextColor("#FFFFFF"); // Texto Blanco
          let titleLines = pdf.splitTextToSize(titulo, CONTENT_WIDTH);
          pdf.text(titleLines, PAGE_WIDTH / 2, currentY + 10, {
            align: "center",
          }); // Centrado horizontal
          currentY += titleLines.length * 10 + 5;

          pdf.setFontSize(18);
          pdf.setFont("times", "normal");
          pdf.setTextColor("#FFFFFF"); // Texto Blanco
          let subtitleLines = pdf.splitTextToSize(subtitulo, CONTENT_WIDTH);
          pdf.text(subtitleLines, PAGE_WIDTH / 2, currentY + 5, {
            align: "center",
          }); // Centrado horizontal
          currentY +=
            subtitleLines.length * 7 + 15 + bannerHeight - textBlockHeight; // Ajusta Y después del banner
          // --- FIN CAMBIO PORTADA ---

          if (imageStore.portada) {
            checkPageBreak(imgHeight + 10);
            pdf.addImage(
              imageStore.portada,
              "PNG",
              MARGIN_LEFT,
              currentY,
              CONTENT_WIDTH,
              imgHeight
            );
            currentY += imgHeight + 10;
          }

          pdf.addPage();
          currentY = MARGIN_TOP;
          setupPage();

          // --- PASO 2: INTRODUCCIÓN ---
          addSectionTitle("Introducción");
          pdf.setFontSize(12);
          pdf.setFont("times", "normal");
          pdf.setTextColor(TEXTO_NORMAL);
          const intro = document.getElementById("texto-intro").value;
          let lines = pdf.splitTextToSize(intro, CONTENT_WIDTH);
          for (let line of lines) {
            checkPageBreak(8);
            pdf.text(line, MARGIN_LEFT, currentY, { align: "justify" });
            currentY += 8;
          }
          // currentY += 10; // Eliminado, addSectionTitle ya añade espacio

          // --- PASO 3: CONCEPTOS CLAVE ---
          addSectionTitle("Conceptos Clave");
          const conceptos = document.querySelectorAll(
            "#conceptos-list .dynamic-item"
          );
          for (let concepto of conceptos) {
            const cTitulo = concepto.querySelector(".concepto-titulo").value;
            const cDesc = concepto.querySelector(".concepto-desc").value;
            if (!cTitulo && !cDesc) continue;
            checkPageBreak(25);
            pdf.setDrawColor(PDF_AZUL);
            pdf.setLineWidth(1);
            pdf.line(MARGIN_LEFT, currentY - 5, MARGIN_LEFT, currentY + 1);
            pdf.setFontSize(15);
            pdf.setFont("times", "bold");
            pdf.setTextColor(PDF_AZUL);
            pdf.text(cTitulo, MARGIN_LEFT + 3, currentY);
            currentY += 8;
            pdf.setFontSize(12);
            pdf.setFont("times", "normal");
            pdf.setTextColor(TEXTO_NORMAL);
            lines = pdf.splitTextToSize(cDesc, CONTENT_WIDTH - 3);
            for (let line of lines) {
              checkPageBreak(8);
              pdf.text(line, MARGIN_LEFT + 3, currentY, { align: "justify" });
              currentY += 8;
            }
            currentY += 8;
          }

          // --- PASOS 4, 5, 6: ENSAYOS ---
          const ensayos = [
            {
              t: "titulo-ensayo1",
              txt: "texto-ensayo1",
              img: imageStore.ensayo1,
            },
            {
              t: "titulo-ensayo2",
              txt: "texto-ensayo2",
              img: imageStore.ensayo2,
            },
            {
              t: "titulo-ensayo3",
              txt: "texto-ensayo3",
              img: imageStore.ensayo3,
            },
          ];
          for (let ensayo of ensayos) {
            const tituloEnsayo = document.getElementById(ensayo.t).value;
            const textoEnsayo = document.getElementById(ensayo.txt).value;
            if (tituloEnsayo || textoEnsayo) {
              addSectionTitle(tituloEnsayo);
              if (ensayo.img) {
                const imgH = CONTENT_WIDTH * (7 / 16);
                checkPageBreak(imgH + 10);
                pdf.addImage(
                  ensayo.img,
                  "PNG",
                  MARGIN_LEFT,
                  currentY,
                  CONTENT_WIDTH,
                  imgH
                );
                currentY += imgH + 10;
              }
              pdf.setFontSize(12);
              pdf.setFont("times", "normal");
              pdf.setTextColor(TEXTO_NORMAL);
              lines = pdf.splitTextToSize(textoEnsayo, CONTENT_WIDTH);
              for (let line of lines) {
                checkPageBreak(8);
                pdf.text(line, MARGIN_LEFT, currentY, { align: "justify" });
                currentY += 8;
              }
            }
          }

          // --- PASO 7: CONCLUSIONES ---
          addSectionTitle("Conclusiones");
          pdf.setFontSize(12);
          pdf.setFont("times", "normal");
          pdf.setTextColor(TEXTO_NORMAL);
          const conclusiones =
            document.getElementById("texto-conclusiones").value;
          lines = pdf.splitTextToSize(conclusiones, CONTENT_WIDTH);
          for (let line of lines) {
            checkPageBreak(8);
            pdf.text(line, MARGIN_LEFT, currentY, { align: "justify" });
            currentY += 8;
          }

          // --- PASO 8: BIBLIOGRAFÍA ---
          addSectionTitle("Bibliografía");
          pdf.setFontSize(11);
          pdf.setFont("times", "normal");
          pdf.setTextColor(TEXTO_NORMAL);
          const referencias = document.querySelectorAll(
            "#biblio-list .biblio-ref"
          );
          for (let ref of referencias) {
            const refValue = ref.value;
            if (!refValue) continue;
            checkPageBreak(15);
            lines = pdf.splitTextToSize(refValue, CONTENT_WIDTH);
            for (let line of lines) {
              checkPageBreak(6.5);
              pdf.text(line, MARGIN_LEFT, currentY);
              currentY += 6.5;
            }
            currentY += 3;
          }

          // --- AÑADIR ENCABEZADO Y NÚMERO DE PÁGINA ---
          const totalPages = pdf.internal.getNumberOfPages();
          if (totalPages > 1) {
            pdf.setFontSize(10);
            pdf.setFont("times", "normal");
            pdf.setTextColor(PDF_GRIS);
            for (let i = 2; i <= totalPages; i++) {
              pdf.setPage(i);
              pdf.setDrawColor(PDF_AZUL);
              pdf.setLineWidth(0.5);
              pdf.line(
                MARGIN_LEFT,
                MARGIN_TOP - 10,
                PAGE_WIDTH - MARGIN_RIGHT,
                MARGIN_TOP - 10
              );
              pdf.text(
                `Página ${i - 1}`,
                PAGE_WIDTH - MARGIN_RIGHT,
                PAGE_HEIGHT - 15,
                { align: "right" }
              );
            }
          }
          // --- FIN: GUARDAR PDF ---
          pdf.save("documento_CUN_generado.pdf");
        } catch (error) {
          console.error("Error generando el PDF:", error);
          alert(
            "Hubo un error al generar el PDF. Revisa la consola para más detalles."
          );
        } finally {
          finishBtn.disabled = false;
          finishBtn.textContent = "Generar PDF";
        }
      } // Fin generatePDF
    </script>
  </body>
</html>
